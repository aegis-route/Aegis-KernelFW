# ===============================================================
# Aegis-KernelFW Configuration Rules (Example)
# ===============================================================

# 1. Global Firewall Policy (PASS or DROP)
DEFAULT_POLICY=PASS

# 2. IP Whitelist (LPM Trie - Fast path pass)
# Subnets or individual hosts that bypass all checks
WHITELIST_CIDRS=(
    "127.0.0.1/32"
    "192.168.1.0/24"
    "10.0.0.1/32"
)

# 3. IP Blacklist (LPM Trie - Immediate XDP_DROP at NIC)
# Known malicious scanners, scanners, attackers
BLACKLIST_CIDRS=(
    "45.33.32.156/32"
    "198.51.100.0/24"
    "203.0.113.50/32"
)

# 4. Layer 4 Port Rules (Protocol, Port, Action)
# Syntax: <protocol> <port> <drop|pass>
L4_RULES=(
    "tcp 23 drop"     # Block Telnet
    "tcp 22 pass"     # Allow SSH
    "tcp 80 pass"     # Allow HTTP
    "tcp 443 pass"    # Allow HTTPS
    "udp 53 pass"     # Allow DNS
    "udp 123 pass"    # Allow NTP
    "icmp 0 drop"     # Block ICMP (Ping)
)
